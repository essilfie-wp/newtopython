<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dice Game</title>
</head>

<body>
    <div class="game-card">
        <h1>🎲 Dice Game 🎲 </h1>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <p>Player: <span id="player-score">0</span></p>
            <p>Computer: <span id="computer-score">0</span></p>
            <p>Ties: <span id="ties">0</span></p>
        </div>

        <!-- Dice Area -->
        <div class="arena">
            <!-- Player Panel-->
            <div class="player-panel">
                <h3>You</h3>
                <div class="dice-row">
                    <div class="die" id="p-die-1"></div>
                    <div class="die" id="p-die-2"></div>
                </div>
                <div class="total-pill" id="p-total">Total: 0</div>
            </div>

            <!-- Computer Panel-->
            <div class="computer-panel">
                <h3>Computer</h3>
                <div class="dice-row">
                    <div class="die" id="c-die-1"></div>
                    <div class="die" id="c-die-2"></div>
                </div>
                <div class="total-pill" id="c-total">Total: 0</div>
            </div>
        </div>

        <!-- Result banner -->
        <div class="result-msg" id="result-msg">Roll the dice to start!</div>

        <!-- Controls -->
        <div class="btn-group">
            <button class="btn-roll" id="btn-roll">🎲Roll Dice</button>
            <button id="reset-btn">Reset Score</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
